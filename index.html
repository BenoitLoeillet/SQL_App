<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Editor — Database Course</title>
  <style>
    :root {
      --bg:        #f7f6f3;
      --surface:   #ffffff;
      --surface2:  #f0efe9;
      --border:    #e0ddd5;
      --border2:   #c8c5bc;
      --text:      #1a1917;
      --text2:     #6b6860;
      --text3:     #a8a59e;
      --green:     #1D9E75;
      --green-bg:  #e1f5ee;
      --green-bd:  #5DCAA5;
      --green-txt: #0F6E56;
      --red-bg:    #fcebeb;
      --red-bd:    #f09595;
      --red-txt:   #a32d2d;
      --amber:     #EF9F27;
      --radius:    8px;
      --radius-lg: 12px;
      --mono:      'Courier New', Courier, monospace;
      --sans:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --sidebar-w: 220px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #1a1917;
        --surface:   #232220;
        --surface2:  #2c2b28;
        --border:    #3a3835;
        --border2:   #504e49;
        --text:      #f0ede6;
        --text2:     #a8a59e;
        --text3:     #6b6860;
        --green-bg:  #04342c;
        --green-bd:  #0F6E56;
        --green-txt: #9FE1CB;
        --red-bg:    #2a0f0f;
        --red-bd:    #7a2222;
        --red-txt:   #f7c1c1;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ─────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .topbar-title { font-size: 14px; font-weight: 600; }
    .topbar-sub { font-size: 12px; color: var(--text2); margin-left: auto; }

    /* ── Layout ──────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-right: 0.5px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
      padding: 14px 0;
    }
    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 0 14px 8px;
    }
    .sidebar-loading {
      font-size: 12px;
      color: var(--text3);
      padding: 0 14px;
      font-style: italic;
    }

    .table-entry { margin-bottom: 2px; }

    .table-name {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      border-radius: 0;
      user-select: none;
    }
    .table-name:hover { background: var(--surface2); }
    .table-name.active { background: var(--surface2); }

    .table-icon {
      font-size: 10px;
      color: var(--text3);
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .table-icon.open { transform: rotate(90deg); }

    .table-grid-icon {
      width: 13px; height: 13px;
      flex-shrink: 0;
      color: var(--green);
    }

    .columns-list {
      display: none;
      padding: 2px 0 6px 34px;
    }
    .columns-list.open { display: block; }

    .col-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 14px 3px 0;
      font-size: 11.5px;
      color: var(--text2);
      cursor: pointer;
    }
    .col-row:hover { color: var(--text); }
    .col-name { font-family: var(--mono); }
    .col-type {
      font-size: 10px;
      color: var(--text3);
      margin-left: auto;
      white-space: nowrap;
    }

    /* Quick SELECT button */
    .btn-select-all {
      display: block;
      margin: 4px 14px 2px;
      padding: 4px 8px;
      font-size: 11px;
      font-family: var(--mono);
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text2);
      cursor: pointer;
      text-align: left;
      width: calc(100% - 28px);
    }
    .btn-select-all:hover { color: var(--text); border-color: var(--border2); }

    /* ── Main area ───────────────────────────────────────── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .config-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 13px;
      margin-bottom: 1.25rem;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--text2);
    }
    .config-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }

    .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      padding: 13px 15px;
      background: var(--surface);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      resize: vertical;
      outline: none;
      margin-bottom: 10px;
      tab-size: 2;
    }
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(29,158,117,0.10);
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.25rem;
    }
    .btn-run {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 18px;
      font-size: 13px; font-weight: 500; font-family: var(--sans);
      background: var(--surface);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
    }
    .btn-run:hover { background: var(--surface2); }
    .btn-run:active { transform: scale(0.98); }
    .btn-run.loading { opacity: 0.55; pointer-events: none; }

    .btn-clear {
      padding: 7px 13px; font-size: 13px; font-family: var(--sans);
      background: transparent; border: none;
      color: var(--text2); cursor: pointer;
      border-radius: var(--radius);
    }
    .btn-clear:hover { background: var(--surface2); color: var(--text); }
    .hint-time { font-size: 12px; color: var(--text3); margin-left: auto; font-family: var(--mono); }

    .status-bar {
      font-size: 13px; padding: 8px 13px;
      border-radius: var(--radius); margin-bottom: 1rem;
      border: 0.5px solid transparent;
    }
    .status-bar.hidden { display: none; }
    .status-bar.error   { background: var(--red-bg);   border-color: var(--red-bd);   color: var(--red-txt); }
    .status-bar.success { background: var(--green-bg); border-color: var(--green-bd); color: var(--green-txt); }

    .results-section { display: none; margin-bottom: 1.5rem; }
    .results-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text3); margin-bottom: 8px;
    }
    .results-count { font-weight: 400; }

    .table-wrap {
      overflow-x: auto;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { border-bottom: 0.5px solid var(--border2); }
    th {
      text-align: left; padding: 8px 13px;
      font-size: 10px; font-weight: 700;
      color: var(--text2); background: var(--surface2);
      white-space: nowrap; letter-spacing: 0.04em;
    }
    td { padding: 8px 13px; color: var(--text); border-bottom: 0.5px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    td.null-val { color: var(--text3); font-style: italic; }
    td.num-val  { font-family: var(--mono); font-size: 12px; }

    .footer {
      font-size: 11px; color: var(--text3);
      text-align: center; padding: 12px;
      border-top: 0.5px solid var(--border);
      margin-top: auto;
    }

    @media (max-width: 600px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="dot"></div>
    <span class="topbar-title">SQL Editor</span>
    <span class="topbar-sub" id="course-label"></span>
  </div>

  <div class="layout">

    <!-- Sidebar schéma -->
    <aside class="sidebar">
      <div class="sidebar-label">Tables</div>
      <div class="sidebar-loading" id="sidebar-loading">Loading…</div>
      <div id="schema-list"></div>
    </aside>

    <!-- Éditeur principal -->
    <main class="main">

      <div class="config-banner" id="config-banner">
        <div class="config-dot"></div>
          You have access here to multiple databases that are online and stored on a SUPABASE project.
      </div>

      <div class="label">SQL Query</div>
      <textarea id="sql-input"
        placeholder="SELECT * FROM my_table LIMIT 10;"
        spellcheck="false" autocomplete="off" autocorrect="off"></textarea>

      <div class="btn-row">
        <button class="btn-run" id="btn-run" onclick="runQuery()">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
            <polygon points="2,1 11,6 2,11" fill="currentColor"/>
          </svg>
          Run
        </button>
        <button class="btn-clear" onclick="clearAll()">Clear</button>
        <span class="hint-time" id="hint-time"></span>
      </div>

      <div class="status-bar hidden" id="status-bar"></div>

      <div class="results-section" id="results-section">
        <div class="results-label">
          Results <span class="results-count" id="results-count"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="results-head"></thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </div>

      <div class="footer">Only SELECT queries are allowed &nbsp;·&nbsp; Ctrl+Enter to run</div>
    </main>
  </div>

<script>
  <!-- ══ CONFIGURATION ══════════════════════════════════════
  <script>
    const SUPABASE_URL  = 'https://bzhuntwymdoceujuvyhi.supabase.co';
    const ANON_KEY      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6aHVudHd5bWRvY2V1anV2eWhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzY2MDcsImV4cCI6MjA5MTIxMjYwN30.t6lfthdVh3Yci9S_XJzLzqVPDgWHYCoPBqWnI2umd9M';
    const COURSE_LABEL  = 'Bases de données & SQL';   // affiché dans le header
  </script>
  <!-- ══════════════════════════════════════════════════════ -->
  
  /* ── Init ─────────────────────────────────────────────── */
  document.getElementById('course-label').textContent = COURSE_LABEL;
  if (!SUPABASE_URL.includes('VOTRE_ID')) {
    document.getElementById('config-banner').style.display = 'none';
  }

  /* ── RPC helper ───────────────────────────────────────── */
  async function rpc(query) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/run_student_query`, {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'apikey':        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6aHVudHd5bWRvY2V1anV2eWhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzY2MDcsImV4cCI6MjA5MTIxMjYwN30.t6lfthdVh3Yci9S_XJzLzqVPDgWHYCoPBqWnI2umd9M',
        'Authorization': 'Bearer ' + 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6aHVudHd5bWRvY2V1anV2eWhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzY2MDcsImV4cCI6MjA5MTIxMjYwN30.t6lfthdVh3Yci9S_XJzLzqVPDgWHYCoPBqWnI2umd9M'
      },
      body: JSON.stringify({ query })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || err.hint || `Erreur HTTP ${res.status}`);
    }
    return res.json();
  }

  /* ── Load schema sidebar ──────────────────────────────── */
  async function loadSchema() {
    try {
      const rows = await rpc(`
        SELECT table_name, column_name, data_type
        FROM information_schema.columns
        WHERE table_schema = 'public'
        ORDER BY table_name, ordinal_position
      `);

      const tables = {};
      (rows || []).forEach(r => {
        if (!tables[r.table_name]) tables[r.table_name] = [];
        tables[r.table_name].push({ name: r.column_name, type: r.data_type });
      });

      const list = document.getElementById('schema-list');
      document.getElementById('sidebar-loading').style.display = 'none';

      Object.entries(tables).forEach(([tname, cols]) => {
        const entry = document.createElement('div');
        entry.className = 'table-entry';

        const header = document.createElement('div');
        header.className = 'table-name';
        header.innerHTML = `
          <svg class="table-grid-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="1" y="1" width="12" height="12" rx="1.5"/>
            <line x1="1" y1="5" x2="13" y2="5"/>
            <line x1="1" y1="9" x2="13" y2="9"/>
            <line x1="5" y1="1" x2="5" y2="13"/>
          </svg>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tname)}</span>
          <span class="table-icon">▶</span>`;

        const colsDiv = document.createElement('div');
        colsDiv.className = 'columns-list';

        const quickBtn = document.createElement('button');
        quickBtn.className = 'btn-select-all';
        quickBtn.textContent = `SELECT * FROM ${tname} LIMIT 10`;
        quickBtn.onclick = (e) => {
          e.stopPropagation();
          document.getElementById('sql-input').value = `SELECT *\nFROM ${tname}\nLIMIT 10;`;
          runQuery();
        };
        colsDiv.appendChild(quickBtn);

        cols.forEach(col => {
          const colRow = document.createElement('div');
          colRow.className = 'col-row';
          colRow.innerHTML = `
            <span class="col-name">${esc(col.name)}</span>
            <span class="col-type">${shortType(col.type)}</span>`;
          colRow.title = col.type;
          colRow.onclick = () => insertColName(col.name);
          colsDiv.appendChild(colRow);
        });

        header.onclick = () => {
          const icon = header.querySelector('.table-icon');
          const isOpen = colsDiv.classList.toggle('open');
          icon.classList.toggle('open', isOpen);
        };

        entry.appendChild(header);
        entry.appendChild(colsDiv);
        list.appendChild(entry);
      });

      if (Object.keys(tables).length === 0) {
        document.getElementById('sidebar-loading').textContent = 'No tables found.';
        document.getElementById('sidebar-loading').style.display = 'block';
      }

    } catch (e) {
      document.getElementById('sidebar-loading').textContent = 'Loading error.';
    }
  }

  function shortType(t) {
    const map = {
      'integer': 'int', 'bigint': 'bigint', 'smallint': 'int',
      'numeric': 'num', 'real': 'float', 'double precision': 'float',
      'character varying': 'varchar', 'character': 'char', 'text': 'text',
      'boolean': 'bool', 'date': 'date', 'timestamp without time zone': 'timestamp',
      'timestamp with time zone': 'timestamptz', 'uuid': 'uuid', 'json': 'json', 'jsonb': 'jsonb'
    };
    return map[t] || t.split(' ')[0].substring(0, 8);
  }

  function insertColName(colName) {
    const ta = document.getElementById('sql-input');
    const s = ta.selectionStart;
    ta.value = ta.value.substring(0, s) + colName + ta.value.substring(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + colName.length;
    ta.focus();
  }

  /* ── Run query ────────────────────────────────────────── */
  async function runQuery() {
    const query = document.getElementById('sql-input').value.trim();
    if (!query) return;

    const btn = document.getElementById('btn-run');
    const t0  = performance.now();

    btn.classList.add('loading');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.5" fill="none"
        stroke-dasharray="16" stroke-dashoffset="8">
        <animateTransform attributeName="transform" type="rotate"
          from="0 6 6" to="360 6 6" dur="0.7s" repeatCount="indefinite"/>
      </circle></svg> Running…`;
    document.getElementById('status-bar').className = 'status-bar hidden';
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('hint-time').textContent = '';

    try {
      const rows = await rpc(query);
      const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
      document.getElementById('hint-time').textContent = elapsed + 's';

      const arr = Array.isArray(rows) ? rows : [];
      if (arr.length === 0) {
        setStatus('success', 'Query executed — no results returned.');
      } else {
        renderTable(arr);
        document.getElementById('results-count').textContent =
          `— ${arr.length} row${arr.length > 1 ? 's' : ''}`;
        document.getElementById('results-section').style.display = 'block';
        document.getElementById('status-bar').className = 'status-bar hidden';
      }
    } catch (e) {
      setStatus('error', e.message);
    } finally {
      btn.classList.remove('loading');
      btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 12 12" fill="none">
        <polygon points="2,1 11,6 2,11" fill="currentColor"/></svg> Run`;
    }
  }

  function setStatus(type, msg) {
    const el = document.getElementById('status-bar');
    el.className = 'status-bar ' + type;
    el.textContent = msg;
  }

  function renderTable(rows) {
    const keys = Object.keys(rows[0]);
    document.getElementById('results-head').innerHTML =
      '<tr>' + keys.map(k => `<th>${esc(k)}</th>`).join('') + '</tr>';
    document.getElementById('results-body').innerHTML = rows.map(row =>
      '<tr>' + keys.map(k => {
        const v = row[k];
        if (v === null || v === undefined) return '<td class="null-val">null</td>';
        if (typeof v === 'number') return `<td class="num-val">${v}</td>`;
        if (typeof v === 'object') return `<td>${esc(JSON.stringify(v))}</td>`;
        return `<td>${esc(String(v))}</td>`;
      }).join('') + '</tr>'
    ).join('');
  }

  function clearAll() {
    document.getElementById('sql-input').value = '';
    document.getElementById('status-bar').className = 'status-bar hidden';
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('hint-time').textContent = '';
    document.getElementById('sql-input').focus();
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Keyboard ─────────────────────────────────────────── */
  document.getElementById('sql-input').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runQuery(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const ta = e.target, s = ta.selectionStart;
      ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + 2;
    }
  });

  /* ── Boot ─────────────────────────────────────────────── */
  if (!SUPABASE_URL.includes('VOTRE_ID')) loadSchema();
  else document.getElementById('sidebar-loading').textContent = 'Config. required.';
</script>
</body>
</html>
