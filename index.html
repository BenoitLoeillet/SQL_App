<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Editor</title>
  <style>
    :root {
      --bg:#f7f6f3;--surface:#fff;--surface2:#f0efe9;--border:#e0ddd5;--border2:#c8c5bc;
      --text:#1a1917;--text2:#6b6860;--text3:#a8a59e;
      --green:#1D9E75;--green-bg:#e1f5ee;--green-bd:#5DCAA5;--green-txt:#0F6E56;
      --red-bg:#fcebeb;--red-bd:#f09595;--red-txt:#a32d2d;
      --amber:#EF9F27;--radius:8px;--radius-lg:12px;
      --mono:'Courier New',Courier,monospace;
      --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --sidebar-w:220px;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#1a1917;--surface:#232220;--surface2:#2c2b28;--border:#3a3835;--border2:#504e49;
        --text:#f0ede6;--text2:#a8a59e;--text3:#6b6860;
        --green-bg:#04342c;--green-bd:#0F6E56;--green-txt:#9FE1CB;
        --red-bg:#2a0f0f;--red-bd:#7a2222;--red-txt:#f7c1c1;
      }
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

    /* topbar */
    .topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:.5px solid var(--border);background:var(--surface);flex-shrink:0;}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0;}
    .topbar-title{font-size:14px;font-weight:600;}
    .topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
    .topbar-sub{font-size:12px;color:var(--text2);}
    .lang-switch{display:flex;border:.5px solid var(--border2);border-radius:var(--radius);overflow:hidden;font-size:12px;}
    .lang-btn{padding:4px 10px;background:transparent;border:none;cursor:pointer;color:var(--text2);font-family:var(--sans);font-size:12px;}
    .lang-btn:hover{background:var(--surface2);}
    .lang-btn.active{background:var(--surface2);color:var(--text);font-weight:500;}

    .db-select-wrap{display:flex;align-items:center;gap:6px;}
    .db-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
    select.db-select{font-size:12px;font-family:var(--sans);padding:4px 8px;background:var(--surface);border:.5px solid var(--border2);border-radius:var(--radius);color:var(--text);cursor:pointer;outline:none;}
    select.db-select:focus{border-color:var(--green);}

    .db-label{font-size:12px;color:var(--text2);}
    
    /* layout */
    .layout{display:flex;flex:1;overflow:hidden;}

    /* sidebar */
    .sidebar{width:var(--sidebar-w);flex-shrink:0;border-right:.5px solid var(--border);background:var(--surface);overflow-y:auto;padding:14px 0;}
    .sidebar-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:0 14px 8px;}
    .sidebar-msg{font-size:12px;color:var(--text3);padding:0 14px;font-style:italic;}
    .sidebar-error{font-size:12px;color:var(--red-txt);padding:0 14px;}
    .table-name{display:flex;align-items:center;gap:7px;padding:6px 14px;font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;user-select:none;}
    .table-name:hover{background:var(--surface2);}
    .table-icon{font-size:10px;color:var(--text3);transition:transform .15s;flex-shrink:0;}
    .table-icon.open{transform:rotate(90deg);}
    .table-grid-icon{width:13px;height:13px;flex-shrink:0;color:var(--green);}
    .columns-list{display:none;padding:2px 0 6px 34px;}
    .columns-list.open{display:block;}
    .col-row{display:flex;align-items:center;gap:6px;padding:3px 14px 3px 0;font-size:11.5px;color:var(--text2);cursor:pointer;}
    .col-row:hover{color:var(--text);}
    .col-name{font-family:var(--mono);}
    .col-type{font-size:10px;color:var(--text3);margin-left:auto;white-space:nowrap;}
    .btn-select-all{display:block;margin:4px 14px 2px;padding:4px 8px;font-size:11px;font-family:var(--mono);background:var(--surface2);border:.5px solid var(--border);border-radius:var(--radius);color:var(--text2);cursor:pointer;text-align:left;width:calc(100% - 28px);}
    .btn-select-all:hover{color:var(--text);border-color:var(--border2);}

    /* main */
    .main{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;}
    .config-banner{display:flex;align-items:center;gap:10px;background:var(--surface2);border:.5px solid var(--border);border-radius:var(--radius);padding:9px 13px;margin-bottom:1.25rem;font-size:12px;font-family:var(--mono);color:var(--text2);}
    .config-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;}
    .label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    textarea{width:100%;min-height:140px;font-family:var(--mono);font-size:13px;line-height:1.65;padding:13px 15px;background:var(--surface);border:.5px solid var(--border2);border-radius:var(--radius);color:var(--text);resize:vertical;outline:none;margin-bottom:10px;tab-size:2;}
    textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.10);}
    .btn-row{display:flex;align-items:center;gap:8px;margin-bottom:1.25rem;}
    .btn-run{display:flex;align-items:center;gap:7px;padding:7px 18px;font-size:13px;font-weight:500;font-family:var(--sans);background:var(--surface);border:.5px solid var(--border2);border-radius:var(--radius);color:var(--text);cursor:pointer;}
    .btn-run:hover{background:var(--surface2);}
    .btn-run:active{transform:scale(.98);}
    .btn-run.loading{opacity:.55;pointer-events:none;}
    .btn-clear{padding:7px 13px;font-size:13px;font-family:var(--sans);background:transparent;border:none;color:var(--text2);cursor:pointer;border-radius:var(--radius);}
    .btn-clear:hover{background:var(--surface2);color:var(--text);}
    .hint-time{font-size:12px;color:var(--text3);margin-left:auto;font-family:var(--mono);}

    /* tabs */
    .tabs-section{display:none;}
    .tabs-bar{display:flex;border-bottom:.5px solid var(--border);margin-bottom:0;gap:0;overflow-x:auto;}
    .tab-btn{padding:7px 16px;font-size:12px;font-family:var(--sans);background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text2);cursor:pointer;white-space:nowrap;margin-bottom:-0.5px;}
    .tab-btn:hover{color:var(--text);}
    .tab-btn.active{color:var(--text);border-bottom-color:var(--green);font-weight:500;}
    .tab-panel{display:none;padding-top:12px;}
    .tab-panel.active{display:block;}

    /* results table */
    .status-bar{font-size:13px;padding:8px 13px;border-radius:var(--radius);margin-bottom:1rem;border:.5px solid transparent;}
    .status-bar.hidden{display:none;}
    .status-bar.error{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-txt);}
    .status-bar.success{background:var(--green-bg);border-color:var(--green-bd);color:var(--green-txt);}
    .table-wrap{overflow-x:auto;overflow-y:auto;max-height:320px;border:.5px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    thead tr{border-bottom:.5px solid var(--border2);}
    th{position:sticky;top:0;z-index:1;text-align:left;padding:8px 13px;font-size:10px;font-weight:700;color:var(--text2);background:var(--surface2);white-space:nowrap;letter-spacing:.04em;}
    td{padding:8px 13px;color:var(--text);border-bottom:.5px solid var(--border);}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:var(--surface2);}
    td.null-val{color:var(--text3);font-style:italic;}
    td.num-val{font-family:var(--mono);font-size:12px;}

    .footer{font-size:11px;color:var(--text3);text-align:center;padding:12px;border-top:.5px solid var(--border);margin-top:auto;}
    
    /* page footer */
    .page-footer{background:var(--surface);border-top:.5px solid var(--border);padding:16px 24px;font-size:11px;color:var(--text2);text-align:center;}
    .page-footer a{color:var(--green);text-decoration:none;}
    .page-footer a:hover{text-decoration:underline;}
    .cc-logo{width:20px;height:20px;display:inline-block;vertical-align:middle;margin:0 4px;}
    .footer-content{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;}
    .footer-section{display:flex;align-items:center;gap:6px;}
    @media(max-width:600px){.sidebar{display:none;}}
  </style>
</head>
<body>

<div class="topbar">
  <div class="dot"></div>
  <span class="topbar-title" id="t-title">SQL Editor</span>
  <div class="topbar-right">
    <span class="topbar-sub" id="course-label"></span>
    <div class="db-select-wrap">
      <div class="db-dot"></div>
      <span class="db-label" id="t-db-label">Database</span>
      <select class="db-select" id="db-select" onchange="switchDatabase()"></select>
    </div>
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('fr')">FR</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label" id="t-tables">Tables</div>
    <div class="sidebar-msg" id="sidebar-loading">Loading...</div>
    <div id="schema-list"></div>
  </aside>
  <main class="main">
    <div class="config-banner" id="config-banner">
      <div class="config-dot"></div>
      <span id="t-config">Replace CURRENT_URL and CURRENT_KEY in the source code.</span>
    </div>
    <div class="label" id="t-query-label">SQL Query</div>
    <textarea id="sql-input" spellcheck="false" autocomplete="off"></textarea>
    <div class="btn-row">
      <button class="btn-run" id="btn-run" onclick="runQuery()">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polygon points="2,1 11,6 2,11" fill="currentColor"/></svg>
        <span id="t-run">Run</span>
      </button>
      <button class="btn-clear" onclick="clearAll()" id="t-clear">Clear</button>
      <span class="hint-time" id="hint-time"></span>
    </div>

    <div class="tabs-section" id="tabs-section">
      <div class="tabs-bar" id="tabs-bar"></div>
      <div id="tabs-content"></div>
    </div>

    <div class="footer" id="t-footer">Only SELECT queries are allowed &nbsp;·&nbsp; Ctrl+Enter to run</div>
  </main>
</div>

<footer class="page-footer">
  <div class="footer-content">
    <div class="footer-section">
      <span>Created by <strong>Benoît Loeillet</strong></span>
    </div>
    <div class="footer-section">
      <span id="footer-year">2026</span>
    </div>
    <div class="footer-section">
      <a href="https://creativecommons.org/licenses/by-sa/4.0/" title="Creative Commons Attribution-ShareAlike 4.0 License" target="_blank">
        <svg class="cc-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="31" fill="none" stroke="currentColor" stroke-width="2"/>
          <text x="32" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="currentColor">cc</text>
        </svg>
        <span>CC BY-SA 4.0</span>
      </a>
    </div>
  </div>
</footer>

<script>
/* ══ CONFIGURATION ═══════════════════════════════════════════
   Supabase → Settings → API                                  */
var DATABASES = {
  'Boutique':     { url: 'https://bzhuntwymdoceujuvyhi.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6aHVudHd5bWRvY2V1anV2eWhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzY2MDcsImV4cCI6MjA5MTIxMjYwN30.t6lfthdVh3Yci9S_XJzLzqVPDgWHYCoPBqWnI2umd9M' },
  'Bikeshare':    { url: 'https://ujwueqekzsnigsmdasma.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqd3VlcWVrenNuaWdzbWRhc21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NDM5MTEsImV4cCI6MjA5MTIxOTkxMX0.OLQlqa0Q3JcIxmgTqw3I3ifTfMZc8lGJTPbiTCtZb98' },
  'Movies':       { url: 'https://CCC.supabase.co', key: '...' }
};

var CURRENT_URL = '';
var CURRENT_KEY = '';

function isConfigured(name) {
  var db = DATABASES[name];
  return db && db.url.indexOf('CCC') === -1 && db.key !== '...';
}

/* --- Menu for database selection --------- */
function switchDatabase() {
  var name = document.getElementById('db-select').value;
  CURRENT_URL = DATABASES[name].url;
  CURRENT_KEY = DATABASES[name].key;
  clearAll();
  loadSchema();
}

(function buildSelect() {
  var sel = document.getElementById('db-select');
  Object.keys(DATABASES).forEach(function(name) {
    var opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name + (isConfigured(name) ? '' : ' (not configured)');
    opt.disabled = !isConfigured(name);
    sel.appendChild(opt);
  });
  var first = Object.keys(DATABASES).find(function(n){ return isConfigured(n); });
  if (first) { sel.value = first; CURRENT_URL = DATABASES[first].url; CURRENT_KEY = DATABASES[first].key; }
})();

var COURSE_LABEL = 'Databases & SQL';
/* ═══════════════════════════════════════════════════════════ */

/* ── i18n ─────────────────────────────────────────────────── */
var LANG = 'en';
var I18N = {
  en: {
    title:        'SQL Editor',
    tables:       'Tables',
    loading:      'Loading...',
    noTables:     'No tables found.',
    config:       'Replace CURRENT_URL and CURRENT_KEY in the source code.',
    configReq:    'Configuration required.',
    queryLabel:   'SQL Query',
    placeholder:  'SELECT * FROM customers LIMIT 10;',
    run:          'Run',
    running:      'Running...',
    clear:        'Clear',
    footer:       'Only SELECT queries are allowed \u00a0·\u00a0 Ctrl+Enter to run',
    results:      'Query',
    rows:         function(n){ return n + ' row' + (n !== 1 ? 's' : ''); },
    noResults:    'Query executed — no results returned.',
    schemaErr:    'Schema loading error. Make sure get_schema() function exists in Supabase.',
    dbLabel: 'Database'
  },
  fr: {
    title:        'Éditeur SQL',
    tables:       'Tables',
    loading:      'Chargement...',
    noTables:     'Aucune table trouvée.',
    config:       'Remplacer CURRENT_URL et CURRENT_KEY dans le code source.',
    configReq:    'Configuration requise.',
    queryLabel:   'Requête SQL',
    placeholder:  'SELECT * FROM customers LIMIT 10;',
    run:          'Exécuter',
    running:      'Exécution...',
    clear:        'Effacer',
    footer:       'Seules les requêtes SELECT sont autorisées \u00a0·\u00a0 Ctrl+Entrée pour exécuter',
    results:      'Requête',
    rows:         function(n){ return n + ' ligne' + (n !== 1 ? 's' : ''); },
    noResults:    'Requête exécutée — aucun résultat retourné.',
    schemaErr:    'Erreur de chargement du schéma. Vérifiez que la fonction get_schema() existe dans Supabase.',
    dbLabel: 'Base de données'
  }
};

function t(key){ return I18N[LANG][key]; }

function setLang(lang) {
  LANG = lang;
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active', b.textContent === lang.toUpperCase());
  });
  applyLang();
}

function applyLang() {
  document.getElementById('t-title').textContent       = t('title');
  document.getElementById('t-tables').textContent      = t('tables');
  document.getElementById('t-query-label').textContent = t('queryLabel');
  document.getElementById('t-run').textContent         = t('run');
  document.getElementById('t-clear').textContent       = t('clear');
  document.getElementById('t-footer').innerHTML        = t('footer');
  document.getElementById('t-config').textContent      = t('config');
  document.getElementById('sql-input').placeholder     = t('placeholder');
  document.getElementById('t-db-label').textContent = t('dbLabel');
  document.title = t('title');

  var sl = document.getElementById('sidebar-loading');
  if (sl.style.display !== 'none') sl.textContent = t('loading');
}

/* ── Init ─────────────────────────────────────────────────── */
var configured = (CURRENT_URL.indexOf('VOTRE_ID') === -1 && CURRENT_KEY.indexOf('VOTRE_CURRENT_KEY') === -1);
document.getElementById('course-label').textContent = COURSE_LABEL;
document.getElementById('footer-year').textContent = new Date().getFullYear();
if (configured) {
  document.getElementById('config-banner').style.display = 'none';
} else {
  document.getElementById('sidebar-loading').textContent = t('configReq');
}
applyLang();

/* ── Helpers ──────────────────────────────────────────────── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shortType(t2) {
  var m = {
    'integer':'int','bigint':'bigint','smallint':'int','numeric':'num','real':'float',
    'double precision':'float','character varying':'varchar','character':'char','text':'text',
    'boolean':'bool','date':'date','timestamp without time zone':'timestamp',
    'timestamp with time zone':'timestamptz','uuid':'uuid','json':'json','jsonb':'jsonb'
  };
  return m[t2] || t2.split(' ')[0].substring(0,8);
}

/* ── RPC ──────────────────────────────────────────────────── */
function rpc(query) {
  return fetch(CURRENT_URL + '/rest/v1/rpc/run_student_query', {
    method: 'POST',
    headers: { 'Content-Type':'application/json','apikey':CURRENT_KEY,'Authorization':'Bearer '+CURRENT_KEY },
    body: JSON.stringify({ query: query })
  }).then(function(res) {
    if (!res.ok) return res.json().catch(function(){ return {}; }).then(function(e){ throw new Error(e.message || 'HTTP '+res.status); });
    return res.json();
  });
}

/* ── Schema sidebar ───────────────────────────────────────── */
function loadSchema() {
  if (!configured) return;
  var loading = document.getElementById('sidebar-loading');
  loading.textContent = t('loading');
  loading.className = 'sidebar-msg';
  loading.style.display = 'block';

  fetch(CURRENT_URL + '/rest/v1/rpc/get_schema', {
    method: 'POST',
    headers: { 'Content-Type':'application/json','apikey':CURRENT_KEY,'Authorization':'Bearer '+CURRENT_KEY },
    body: JSON.stringify({})
  }).then(function(res) {
    if (!res.ok) return res.json().catch(function(){ return {}; }).then(function(e){ throw new Error(e.message || 'HTTP '+res.status); });
    return res.json();
  }).then(function(rows) {
    var tables = {};
    (rows || []).forEach(function(r) {
      if (!tables[r.table_name]) tables[r.table_name] = [];
      tables[r.table_name].push({ name: r.column_name, type: r.data_type });
    });

    var list = document.getElementById('schema-list');
    list.innerHTML = '';
    loading.style.display = 'none';

    if (Object.keys(tables).length === 0) {
      loading.textContent = t('noTables');
      loading.style.display = 'block';
      return;
    }

    Object.keys(tables).forEach(function(tname) {
      var cols  = tables[tname];
      var entry = document.createElement('div');
      entry.className = 'table-entry';

      var header = document.createElement('div');
      header.className = 'table-name';
      header.innerHTML =
        '<svg class="table-grid-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">' +
          '<rect x="1" y="1" width="12" height="12" rx="1.5"/>' +
          '<line x1="1" y1="5" x2="13" y2="5"/><line x1="1" y1="9" x2="13" y2="9"/><line x1="5" y1="1" x2="5" y2="13"/>' +
        '</svg>' +
        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(tname) + '</span>' +
        '<span class="table-icon">&#9658;</span>';

      var colsDiv = document.createElement('div');
      colsDiv.className = 'columns-list';

      var quickBtn = document.createElement('button');
      quickBtn.className = 'btn-select-all';
      quickBtn.textContent = 'SELECT * FROM ' + tname + ' LIMIT 10';
      (function(tn) {
        quickBtn.onclick = function(e) {
          e.stopPropagation();
          document.getElementById('sql-input').value = 'SELECT *\nFROM ' + tn + '\nLIMIT 10;';
          runQuery();
        };
      })(tname);
      colsDiv.appendChild(quickBtn);

      cols.forEach(function(col) {
        var colRow = document.createElement('div');
        colRow.className = 'col-row';
        colRow.innerHTML = '<span class="col-name">'+esc(col.name)+'</span><span class="col-type">'+esc(shortType(col.type))+'</span>';
        colRow.title = col.type;
        (function(n){ colRow.onclick = function(){ insertColName(n); }; })(col.name);
        colsDiv.appendChild(colRow);
      });

      (function(h, c) {
        h.onclick = function() {
          var isOpen = c.classList.toggle('open');
          h.querySelector('.table-icon').classList.toggle('open', isOpen);
        };
      })(header, colsDiv);

      entry.appendChild(header);
      entry.appendChild(colsDiv);
      list.appendChild(entry);
    });
  }).catch(function(e) {
    loading.className = 'sidebar-error';
    loading.textContent = t('schemaErr');
    loading.style.display = 'block';
    console.error('get_schema error:', e.message);
  });
}

function insertColName(colName) {
  var ta = document.getElementById('sql-input');
  var s  = ta.selectionStart;
  ta.value = ta.value.substring(0, s) + colName + ta.value.substring(ta.selectionEnd);
  ta.selectionStart = ta.selectionEnd = s + colName.length;
  ta.focus();
}

/* ── Run query ────────────────────────────────────────────── */
function runQuery() {
  var input = document.getElementById('sql-input').value;
  var queries = input.split(';').map(function(q){ return q.trim(); }).filter(function(q){ return q.length > 0; });
  if (queries.length === 0) return;

  var btn = document.getElementById('btn-run');
  btn.classList.add('loading');
  btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="16" stroke-dashoffset="8"><animateTransform attributeName="transform" type="rotate" from="0 6 6" to="360 6 6" dur="0.7s" repeatCount="indefinite"/></circle></svg> ' + t('running');

  var tabsSection = document.getElementById('tabs-section');
  var tabsBar     = document.getElementById('tabs-bar');
  var tabsContent = document.getElementById('tabs-content');
  tabsSection.style.display = 'none';
  tabsBar.innerHTML = '';
  tabsContent.innerHTML = '';
  document.getElementById('hint-time').textContent = '';

  var t0 = performance.now();
  var chain = Promise.resolve();
  var panels = [];
  var serverResponses = [];

  queries.forEach(function(query, index) {
    chain = chain.then(function() {
      return rpc(query).then(function(rows) {
        var arr = Array.isArray(rows) ? rows : [];
        panels.push({ index: index, arr: arr, error: null });
      }).catch(function(e) {
        panels.push({ index: index, arr: [], error: e.message });
      });
    });
  });

  chain.then(function() {
    var elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    document.getElementById('hint-time').textContent = elapsed + 's';

    panels.forEach(function(p, i) {
      var tabBtn = document.createElement('button');
      tabBtn.className = 'tab-btn' + (i === 0 ? ' active' : '');
      tabBtn.textContent = t('results') + ' ' + (p.index + 1) + (p.error ? ' ⚠' : ' (' + t('rows')(p.arr.length) + ')');
      (function(idx) {
        tabBtn.onclick = function() {
          document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
          document.querySelectorAll('.tab-panel').forEach(function(b){ b.classList.remove('active'); });
          tabBtn.classList.add('active');
          document.getElementById('tab-panel-' + idx).classList.add('active');
        };
      })(i);
      tabsBar.appendChild(tabBtn);

      var panel = document.createElement('div');
      panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
      panel.id = 'tab-panel-' + i;

      if (p.error) {
        panel.innerHTML = '<div class="status-bar error">' + esc(p.error) + '</div>';
      } else if (p.arr.length === 0) {
        panel.innerHTML = '<div class="status-bar success">' + t('noResults') + '</div>';
      } else {
        var keys = Object.keys(p.arr[0]);
        panel.innerHTML =
          '<div class="table-wrap"><table>' +
          '<thead><tr>' + keys.map(function(k){ return '<th>'+esc(k)+'</th>'; }).join('') + '</tr></thead>' +
          '<tbody>' + p.arr.map(function(row) {
            return '<tr>' + keys.map(function(k) {
              var v = row[k];
              if (v === null || v === undefined) return '<td class="null-val">null</td>';
              if (typeof v === 'number') return '<td class="num-val">'+v+'</td>';
              if (typeof v === 'object') return '<td>'+esc(JSON.stringify(v))+'</td>';
              return '<td>'+esc(String(v))+'</td>';
            }).join('') + '</tr>';
          }).join('') +
          '</tbody></table></div>';
      }
      tabsContent.appendChild(panel);
    });

    tabsSection.style.display = 'block';

    btn.classList.remove('loading');
    btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polygon points="2,1 11,6 2,11" fill="currentColor"/></svg> <span id="t-run">'+t('run')+'</span>';
  });
}

function clearAll() {
  document.getElementById('sql-input').value = '';
  document.getElementById('tabs-section').style.display = 'none';
  document.getElementById('tabs-bar').innerHTML = '';
  document.getElementById('tabs-content').innerHTML = '';
  document.getElementById('hint-time').textContent = '';
  document.getElementById('sql-input').focus();
}

/* ── Keyboard ─────────────────────────────────────────────── */
document.getElementById('sql-input').addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runQuery(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    var ta = e.target, s = ta.selectionStart;
    ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 2;
  }
});

/* ── Boot ─────────────────────────────────────────────────── */
loadSchema();
</script>
